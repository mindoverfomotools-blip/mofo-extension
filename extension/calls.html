<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MOFO · my calls</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { color-scheme: dark; --ui: 'MOFO Archivo', Archivo, -apple-system, BlinkMacSystemFont, Inter, sans-serif; --mono: 'MOFO Martian', 'Martian Mono', ui-monospace, Menlo, monospace; }
  * { box-sizing: border-box; }
  html { background: #0B091F; }
  body { font: 400 14px/1.55 var(--ui); background: #0B091F; color: #EAEDFF; max-width: 980px; margin: 0 auto; padding: 44px 20px 90px; -webkit-font-smoothing: antialiased; }
  .wm { display: flex; align-items: flex-end; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid #EAEDFF; }
  .wm b { font: 900 52px/0.85 var(--ui); font-stretch: 125%; letter-spacing: -0.04em; }
  .wm span { font: 400 10px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; padding-bottom: 4px; }
  h2 { display: flex; align-items: center; gap: 10px; font: 600 10px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; margin: 34px 0 12px; }
  h2::after { content: ''; flex: 1; height: 1px; background: #EAEDFF; }
  .score { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; }
  .score .big { font: 900 clamp(34px, 7vw, 72px)/0.95 var(--ui); font-stretch: 125%; letter-spacing: -.02em; }
  .score .big i { font-style: normal; background: #EAEDFF; color: #0B091F; padding: 0 .12em; }
  .score .sub { font: 500 12px/1.5 var(--mono); letter-spacing: .08em; text-transform: uppercase; margin-top: 10px; }
  button { position: relative; isolation: isolate; padding: 11px 16px 10px; background: none; color: #0B091F; border: 0; cursor: pointer; font: 700 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
  button::before { content: ''; position: absolute; inset: 0; z-index: -1; background: #EAEDFF; clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px); }
  button.ghost { color: #EAEDFF; } button.ghost::before { background: none; box-shadow: none; }
  button.ghost { box-shadow: inset 0 0 0 1px #EAEDFF; }
  button:hover { outline: 1px solid #EAEDFF; outline-offset: 3px; }
  .list { display: grid; gap: 0; }
  .c { display: grid; grid-template-columns: 70px minmax(0, 1.2fr) 70px minmax(0, 1fr) 70px auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px dotted #EAEDFF; font: 500 12.5px/1.3 var(--mono); }
  .c > * { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .c .sym { font: 800 15px/1.2 var(--ui); font-stretch: 112%; }
  .c .side { font-weight: 700; letter-spacing: .1em; }
  .c .res { font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .c .res.right { background: #EAEDFF; color: #0B091F; padding: 3px 5px 2px; justify-self: start; }
  .c .res.wrong { text-decoration: line-through; }
  .c .res.open, .c .res.flat, .c .res.void { opacity: .7; }
  .c .pts { text-align: right; font-weight: 700; }
  .muted { opacity: .7; font: 300 13px/1.5 var(--ui); }
  canvas { display: none; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs button.on { outline: 1px solid #EAEDFF; outline-offset: 3px; }
  .boards { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; }
  .boards h3 { font: 600 10px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; margin: 0 0 10px; }
  .br { display: grid; grid-template-columns: 34px minmax(0, 1fr) 62px 56px auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px dotted #EAEDFF; font: 500 12.5px/1.3 var(--mono); }
  .br > * { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .br .rk { font-weight: 700; }
  .br .nm { font: 800 14px/1.2 var(--ui); font-stretch: 112%; }
  .br.first { background: #EAEDFF; color: #0B091F; padding-left: 6px; padding-right: 6px; }
  .br.first a { color: #0B091F; }
  .br a { font: 600 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
  .br .acc, .br .pt { text-align: right; }
  @media (max-width: 720px) { .boards { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 720px) {
    .score { grid-template-columns: minmax(0, 1fr); }
    .c { grid-template-columns: 58px minmax(0, 1fr) 54px auto; }
    .c .when, .c .move { display: none; }
  }
</style>
</head>
<body>
<div class="wm"><b>MOFO</b><span>the call · my calls</span></div>
<h2>Today</h2>
<div class="score" id="score"><div class="muted">Loading…</div></div>
<h2 id="board">Caller board</h2>
<div class="tabs" id="tabs"><button data-range="day" class="on">Today</button><button data-range="week" class="ghost">This week</button><button data-range="all" class="ghost">All time</button></div>
<div class="boards"><div><h3>Best callers</h3><div id="best"></div></div><div><h3>Fade list</h3><div id="worst"></div></div></div>
<h2>Calls</h2>
<div class="list" id="list"></div>
<canvas id="cv" width="1600" height="900"></canvas>
<script src="calls.js"></script>
</body>
</html>
